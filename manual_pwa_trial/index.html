<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#20384d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icons/icon-180.png"><title>MRIシーケンス表</title><link rel="manifest" href="manifest.webmanifest"><style>body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;margin:0;background:#f4f6f8;color:#243242}header{background:#20384d;color:white;padding:18px 16px;font-weight:700;font-size:20px}main{max-width:680px;margin:auto;padding:16px}button,input,textarea,select{font:inherit}button{border:0;border-radius:9px;padding:11px 14px;background:#23658c;color:white;cursor:pointer}button.secondary{background:#e4eaf0;color:#243242}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.card{background:white;border:1px solid #dfe4e9;border-radius:12px;padding:15px;margin:10px 0}.item{display:block;width:100%;text-align:left;background:white;color:#243242;border:1px solid #e0e4e9;margin:8px 0;padding:15px}.muted{color:#64748b;font-size:13px}input,textarea,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;background:white;margin:5px 0 12px}textarea{min-height:200px;resize:vertical}label{font-size:14px;font-weight:600}.bodytext{white-space:pre-wrap;line-height:1.75;overflow-wrap:anywhere}.hidden{display:none}h2{font-size:19px}img{max-width:100%;height:auto;border-radius:8px;margin:8px 0}.notice{background:#fff8e8;border:1px solid #f0dba7;border-radius:9px;padding:12px;font-size:13px}</style></head><body><header>MRIシーケンス表</header><main><div id="app"></div><input id="importFile" type="file" accept=".json,application/json" hidden><input type="file" id="setupFile" accept=".json,application/json" hidden><input id="imageFile" type="file" accept="image/*" hidden></main><script>
'use strict';const KEY='mri_sequence_plain_v1';const LEGACY_KEY='manual_app_v1';const REMOTE_FILE='./latest.json';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();let db={version:1,categories:[],manuals:[]};let secret=null,unlocked=false;
async function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('保存に失敗しました：'+e.message);return false}}
async function start(){try{const local=localStorage.getItem(KEY);if(local){const d=JSON.parse(local);if(validData(d)){db=d;render();return}}const r=await fetch(REMOTE_FILE+'?t='+Date.now(),{cache:'no-store'});if(r.ok){const d=await r.json();if(validData(d)){db=d;await save()}}}catch(e){console.warn(e)}render()}
let page='home',selected=null,editing=null,query='',pendingImage=null;const app=document.getElementById('app');async function save(){try{const encrypted=await seal(db,secret);localStorage.setItem(KEY,JSON.stringify(encrypted));return true}catch(e){alert('暗号化保存に失敗しました：'+e.message);return false}}function nav(p,s=null){page=p;selected=s;render()}function button(t,fn,cls=''){return `<button ${cls?`class="${cls}"`:''} data-action="${fn}">${t}</button>`}function childrenOf(parent){return db.categories.filter(c=>(c.parentId||null)===parent)}
function breadcrumb(cid){const names=[],seen=new Set();let c=db.categories.find(x=>x.id===cid);while(c&&!seen.has(c.id)){seen.add(c.id);names.unshift(c.name);c=db.categories.find(x=>x.id===c.parentId)}return names.join(' › ')}
function descendants(cid){const found=new Set([cid]);let changed=true;while(changed){changed=false;for(const c of db.categories)if(c.parentId&&found.has(c.parentId)&&!found.has(c.id)){found.add(c.id);changed=true}}return found}
function categoryCards(parent){return childrenOf(parent).map(c=>`<button class="item" data-cat="${esc(c.id)}"><strong>📁 ${esc(c.name)}</strong><div class="muted">${db.manuals.filter(m=>m.categoryId===c.id).length}件のマニュアル・${childrenOf(c.id).length}件のサブカテゴリー</div></button>`).join('')}
function render(){if(false){app.innerHTML=`<div class="card"><h2>🔒 院内マニュアル</h2><p class="muted">管理者が決めた共通パスワードを入力してください。職員は新規設定できません。</p><label>パスワード</label><input id="pass" type="password" autocomplete="off"><button data-action="unlock">ロック解除</button><details class="card"><summary>管理者用：初回設定（Ver.0.9）</summary><p class="muted">8文字以上の共通パスワードを入力し、バックアップJSONを読み込みます。設定後、暗号化データをGitHubに公開してください。</p><button class="secondary" data-action="adminSetup">管理者として初期設定</button></details><p class="notice">共通パスワードを忘れると復号できません。パスワードは端末間で共通です。</p></div>`;return}if(page==='home'){app.innerHTML=`<p class="muted">端末内保存・オフライン閲覧対応。最新版の取得には通信が必要です</p><input id="search" placeholder="タイトル・本文を検索" value="${esc(query)}"><div class="toolbar">${button('＋ カテゴリー追加','addCategory')}${button('共有用JSONを書き出す','export','secondary')}${button('最新版に更新','sync','secondary')}${button('JSONを読み込む','import','secondary')}</div><div id="results"></div><p class="notice">このアプリの情報はインターネット上で公開されます。患者情報や院外非公開情報を登録しないでください。編集内容はこの端末だけに保存されます。共有するにはJSONを書き出してGitHubにアップロードしてください。最新版に更新すると端末内データが置き換わります。</p>`;document.getElementById('search').addEventListener('input',e=>{query=e.target.value;results()});results();return}if(page==='category'){const c=db.categories.find(x=>x.id===selected);if(!c)return nav('home');app.innerHTML=`${button('← 戻る','parentCategory','secondary')}<h2>📁 ${esc(c.name)}</h2><p class="muted">${esc(breadcrumb(c.id))}</p><div class="toolbar">${button('＋ サブカテゴリー作成','addSubcategory')}${button('＋ マニュアル作成','newManual')}${button('カテゴリー名変更','renameCategory','secondary')}${button('カテゴリー移動','moveCategory','secondary')}${button('カテゴリー削除','deleteCategory','secondary')}</div><h2>サブカテゴリー</h2>${categoryCards(selected)||'<p class="muted">サブカテゴリーはありません。</p>'}<h2>マニュアル</h2>${db.manuals.filter(x=>x.categoryId===selected).map(x=>`<button class="item" data-open="${esc(x.id)}"><strong>📄 ${esc(x.title)}</strong><div class="muted">更新：${esc(x.updatedAt||'—')}</div></button>`).join('')||'<p class="muted">まだマニュアルがありません。</p>'}`;return}if(page==='detail'){const m=db.manuals.find(x=>x.id===selected);if(!m)return nav('home');app.innerHTML=`${button('← 戻る','backCategory','secondary')}<h2>${esc(m.title)}</h2><p class="muted">更新：${esc(m.updatedAt||'—')}</p><div class="card"><div class="bodytext">${esc(m.body)}</div>${(m.images||[]).map(src=>`<img alt="マニュアル画像" src="${src}">`).join('')}</div><div class="toolbar">${button('編集','editManual')}${button('削除','deleteManual','secondary')}</div>`;return}if(page==='edit'){const m=editing||{title:'',body:'',images:[]};app.innerHTML=`${button('← キャンセル','cancelEdit','secondary')}<h2>${editing?'マニュアル編集':'新規マニュアル'}</h2><label>タイトル</label><input id="title" maxlength="150" value="${esc(m.title)}"><label>本文</label><textarea id="body" placeholder="検査手順や注意事項を入力">${esc(m.body)}</textarea><div id="preview">${(m.images||[]).map((src,i)=>`<div class="card"><img alt="添付画像" src="${src}"><button class="secondary" data-remove-image="${i}">画像を削除</button></div>`).join('')}</div><div class="toolbar">${button('＋ 写真を追加','addImage','secondary')}${button('保存','saveManual')}</div><p class="muted">画像は端末内に保存されます。大量・高画質の画像は保存容量を圧迫します。</p>`;return}}function results(){const target=document.getElementById('results');if(!target)return;const q=query.trim().toLocaleLowerCase();if(q){const list=db.manuals.filter(m=>(m.title+' '+m.body).toLocaleLowerCase().includes(q));target.innerHTML=`<h2>検索結果（${list.length}件）</h2>${list.map(m=>`<button class="item" data-open="${esc(m.id)}">${esc(m.title)}<div class="muted">${esc(breadcrumb(m.categoryId))}</div></button>`).join('')}`;}else target.innerHTML=`<h2>カテゴリー</h2>${categoryCards(null)}`}
async function download(){const blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='latest.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>20*1024*1024)throw Error('20MBを超えています');const d=JSON.parse(await f.text());if(!validData(d))throw Error('JSONの形式が不正です');if(!confirm('現在のマニュアルをすべて置き換えます。バックアップ済みですか？'))return;const old=db;db=d;if(!await save()){db=old;return}nav('home');alert('読み込み完了')}catch(err){alert('読み込み失敗：'+err.message)}});
async function syncLatest(){try{const r=await fetch(REMOTE_FILE+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('共有データが見つかりません（HTTP '+r.status+'）');const d=await r.json();if(!validData(d))throw Error('共有データの形式が不正です');if(!confirm('公開データ（'+d.manuals.length+'件）で端末内の全データを置き換えます。バックアップ済みですか？'))return;const old=db;db=d;if(!await save()){db=old;return}nav('home');alert('最新版を取得しました')}catch(e){alert('更新できませんでした：'+e.message)}}
function validData(d){
 if(!d||d.version!==1||!Array.isArray(d.categories)||!Array.isArray(d.manuals))return false;
 if(!d.categories.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&(!c.parentId||typeof c.parentId==='string')))return false;
 if(!d.manuals.every(m=>typeof m.id==='string'&&typeof m.title==='string'&&typeof m.body==='string'&&typeof m.categoryId==='string'&&(!m.images||Array.isArray(m.images)&&m.images.every(x=>typeof x==='string'&&x.startsWith('data:image/')))))return false;
 if(d.categories.some(c=>c.parentId&&!d.categories.some(p=>p.id===c.parentId)))return false;
 if(d.categories.some(c=>{const seen=new Set([c.id]);let p=c.parentId;while(p){if(seen.has(p))return true;seen.add(p);p=d.categories.find(x=>x.id===p)?.parentId}return false}))return false;
 return d.manuals.every(m=>d.categories.some(c=>c.id===m.categoryId));
}
document.getElementById('imageFile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!f.type.startsWith('image/')||f.size>2*1024*1024){alert('画像は2MB以下にしてください');return}const r=new FileReader();r.onload=()=>{const src=String(r.result);if(!/^data:image\/(png|jpeg|gif|webp);base64,/.test(src)){alert('PNG・JPEG・GIF・WebPのみ対応しています');return}editing.images.push(src);const title=document.getElementById('title').value,body=document.getElementById('body').value;editing.title=title;editing.body=body;render()};r.readAsDataURL(f)});
app.addEventListener('click',async e=>{const rm=e.target.closest('[data-remove-image]');if(rm){editing.title=document.getElementById('title').value;editing.body=document.getElementById('body').value;editing.images.splice(Number(rm.dataset.removeImage),1);render();return}const cat=e.target.closest('[data-cat]');if(cat)return nav('category',cat.dataset.cat);const open=e.target.closest('[data-open]');if(open)return nav('detail',open.dataset.open);const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;switch(a){case'home':nav('home');break;case'backCategory':nav('category',db.manuals.find(x=>x.id===selected)?.categoryId);break;case'addCategory':{const name=prompt('カテゴリー名');if(name?.trim()){db.categories.push({id:id(),name:name.trim(),parentId:null});if(await save())render()}break}case'parentCategory':{const c=db.categories.find(x=>x.id===selected);nav(c?.parentId?'category':'home',c?.parentId||null);break}case'addSubcategory':{const name=prompt('サブカテゴリー名');if(name?.trim()){db.categories.push({id:id(),name:name.trim(),parentId:selected});if(await save())render()}break}case'moveCategory':{const options=db.categories.filter(c=>!descendants(selected).has(c.id));const text=['0: 最上位へ',...options.map((c,i)=>`${i+1}: ${breadcrumb(c.id)}`)].join('\\n');const choice=prompt('移動先の番号を入力してください\\n'+text);if(choice===null)break;const n=Number(choice);if(!Number.isInteger(n)||n<0||n>options.length)return alert('番号が正しくありません');db.categories.find(c=>c.id===selected).parentId=n===0?null:options[n-1].id;if(await save())render();break}case'renameCategory':{const c=db.categories.find(x=>x.id===selected),name=prompt('新しいカテゴリー名',c.name);if(name?.trim()){c.name=name.trim();if(await save())render()}break}case'deleteCategory':{if(db.manuals.some(x=>x.categoryId===selected)||childrenOf(selected).length)return alert('マニュアルやサブカテゴリーが入っているカテゴリーは削除できません');if(confirm('カテゴリーを削除しますか？')){const parent=db.categories.find(x=>x.id===selected)?.parentId||null;db.categories=db.categories.filter(x=>x.id!==selected);if(await save())nav(parent?'category':'home',parent)}break}case'newManual':editing={title:'',body:'',images:[]};page='edit';render();break;case'editManual':editing=structuredClone(db.manuals.find(x=>x.id===selected));page='edit';render();break;case'cancelEdit':editing?.id?nav('detail',editing.id):nav('category',selected);break;case'addImage':editing.title=document.getElementById('title').value;editing.body=document.getElementById('body').value;document.getElementById('imageFile').click();break;case'saveManual':{const title=document.getElementById('title').value.trim(),body=document.getElementById('body').value;if(!title)return alert('タイトルを入力してください');editing.title=title;editing.body=body;editing.updatedAt=new Date().toLocaleString('ja-JP');if(editing.id){const i=db.manuals.findIndex(x=>x.id===editing.id);db.manuals[i]=editing}else{editing.id=id();editing.categoryId=selected;db.manuals.push(editing)}if(await save())nav('detail',editing.id);break}case'deleteManual':if(confirm('このマニュアルを削除しますか？')){const c=db.manuals.find(x=>x.id===selected)?.categoryId;db.manuals=db.manuals.filter(x=>x.id!==selected);if(await save())nav('category',c)}break;case'export':await download();break;case'sync':syncLatest();break;case'import':document.getElementById('importFile').click();break}});start();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
</script></body></html>
