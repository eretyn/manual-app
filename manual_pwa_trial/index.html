<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#20384d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icons/icon-180.png"><title>院内マニュアル</title><link rel="manifest" href="manifest.webmanifest"><style>body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;margin:0;background:#f4f6f8;color:#243242}header{background:#20384d;color:white;padding:18px 16px;font-weight:700;font-size:20px}main{max-width:680px;margin:auto;padding:16px}button,input,textarea,select{font:inherit}button{border:0;border-radius:9px;padding:11px 14px;background:#23658c;color:white;cursor:pointer}button.secondary{background:#e4eaf0;color:#243242}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.card{background:white;border:1px solid #dfe4e9;border-radius:12px;padding:15px;margin:10px 0}.item{display:block;width:100%;text-align:left;background:white;color:#243242;border:1px solid #e0e4e9;margin:8px 0;padding:15px}.muted{color:#64748b;font-size:13px}input,textarea,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;background:white;margin:5px 0 12px}textarea{min-height:200px;resize:vertical}label{font-size:14px;font-weight:600}.bodytext{white-space:pre-wrap;line-height:1.75;overflow-wrap:anywhere}.hidden{display:none}h2{font-size:19px}img{max-width:100%;height:auto;border-radius:8px;margin:8px 0}.notice{background:#fff8e8;border:1px solid #f0dba7;border-radius:9px;padding:12px;font-size:13px}</style></head><body><header>院内マニュアル</header><main><div id="app"></div><input id="importFile" type="file" accept=".json,application/json" hidden><input id="imageFile" type="file" accept="image/*" hidden></main><script>
'use strict';const KEY='manual_app_secure_v1';const LEGACY_KEY='manual_app_v1';const REMOTE_FILE='./latest.enc.json';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();let db={version:1,categories:[],manuals:[]};let secret=null,unlocked=false;
const encoder=new TextEncoder(),decoder=new TextDecoder();
const b64=bytes=>btoa(String.fromCharCode(...bytes));
const unb64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
async function derive(password,salt){
 const base=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(data,password){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const key=await derive(password,salt);const bytes=encoder.encode(JSON.stringify(data));
 const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);
 return {format:'manual-encrypted-v1',kdf:'PBKDF2-SHA256',iterations:310000,salt:b64(salt),iv:b64(iv),ciphertext:b64(new Uint8Array(cipher))};
}
async function unseal(obj,password){if(!obj||obj.format!=='manual-encrypted-v1'||obj.iterations!==310000||typeof obj.ciphertext!=='string')throw Error('暗号化データではありません');
 const key=await derive(password,unb64(obj.salt));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(obj.iv)},key,unb64(obj.ciphertext));
 const data=JSON.parse(decoder.decode(plain));if(!validData(data))throw Error('マニュアルの形式が不正です');return data;
}
async function unlock(){
 const pass=document.getElementById('pass')?.value||'';
 if(!pass)return alert('共通パスワードを入力してください');
 try{
  let data=null;const local=localStorage.getItem(KEY);
  if(local){try{data=await unseal(JSON.parse(local),pass)}catch(e){throw Error('パスワードが違います。既存の端末データを保護するため、上書きは行いません。')}}
  else{
   const response=await fetch(REMOTE_FILE+'?t='+Date.now(),{cache:'no-store'});
   if(!response.ok)throw Error('公開データを取得できません（HTTP '+response.status+'）。管理者が公開してから利用してください');
   const payload=JSON.parse(await response.text());
   if(payload.format!=='manual-encrypted-v1')throw Error('管理者がまだ共通パスワードを設定・公開していません');
   data=await unseal(payload,pass);
  }
  db=data;secret=pass;unlocked=true;db.categories.forEach(c=>{if(!('parentId' in c))c.parentId=null});
  if(!local){if(!await save()){unlocked=false;secret=null;return}}
  render();
 }catch(e){secret=null;unlocked=false;alert('ロック解除できません：'+e.message)}
}
async function adminSetup(){
 const pass=document.getElementById('pass')?.value||'';
 if(pass.length<8)return alert('共通パスワードは8文字以上にしてください');
 if(localStorage.getItem(KEY))return alert('既存の暗号化データがあります。設定し直す前にバックアップしてください');
 if(!confirm('管理者用の初期設定です。公開前の端末でのみ実行してください。続けますか？'))return;
 try{
  const response=await fetch(REMOTE_FILE+'?t='+Date.now(),{cache:'no-store'});
  if(response.ok){const payload=await response.json();if(payload.format==='manual-encrypted-v1')throw Error('共通パスワード設定済みの公開データがあります。初期設定はできません')}
  let data={version:1,categories:[{id:'mri',name:'MRI',parentId:null},{id:'ct',name:'CT',parentId:null},{id:'safety',name:'安全管理',parentId:null}],manuals:[]};
  const legacy=localStorage.getItem(LEGACY_KEY);
  if(legacy&&confirm('旧版の端末内マニュアルを引き継ぎますか？')){const old=JSON.parse(legacy);if(!validData(old))throw Error('旧版データが不正です');data=old}
  db=data;secret=pass;if(!await save()){secret=null;return}unlocked=true;render();
  alert('管理者用の初期設定が完了しました。「公開用データを書き出す」でlatest.enc.jsonを作り、GitHubにアップロードしてください。公開前は職員がログインできません。');
 }catch(e){secret=null;alert('初期設定できません：'+e.message)}
}
function lock(){secret=null;unlocked=false;db={version:1,categories:[],manuals:[]};page='home';render()}
let page='home',selected=null,editing=null,query='',pendingImage=null;const app=document.getElementById('app');async function save(){try{const encrypted=await seal(db,secret);localStorage.setItem(KEY,JSON.stringify(encrypted));return true}catch(e){alert('暗号化保存に失敗しました：'+e.message);return false}}function nav(p,s=null){page=p;selected=s;render()}function button(t,fn,cls=''){return `<button ${cls?`class="${cls}"`:''} data-action="${fn}">${t}</button>`}function childrenOf(parent){return db.categories.filter(c=>(c.parentId||null)===parent)}
function breadcrumb(cid){const names=[],seen=new Set();let c=db.categories.find(x=>x.id===cid);while(c&&!seen.has(c.id)){seen.add(c.id);names.unshift(c.name);c=db.categories.find(x=>x.id===c.parentId)}return names.join(' › ')}
function descendants(cid){const found=new Set([cid]);let changed=true;while(changed){changed=false;for(const c of db.categories)if(c.parentId&&found.has(c.parentId)&&!found.has(c.id)){found.add(c.id);changed=true}}return found}
function categoryCards(parent){return childrenOf(parent).map(c=>`<button class="item" data-cat="${esc(c.id)}"><strong>📁 ${esc(c.name)}</strong><div class="muted">${db.manuals.filter(m=>m.categoryId===c.id).length}件のマニュアル・${childrenOf(c.id).length}件のサブカテゴリー</div></button>`).join('')}
function render(){if(!unlocked){app.innerHTML=`<div class="card"><h2>🔒 院内マニュアル</h2><p class="muted">管理者が決めた共通パスワードを入力してください。職員は新規設定できません。</p><label>パスワード</label><input id="pass" type="password" autocomplete="off"><button data-action="unlock">ロック解除</button><details class="card"><summary>管理者用：初回設定（公開前のみ）</summary><p class="muted">初回のみ8文字以上の共通パスワードを設定します。設定後、暗号化データをGitHubに公開してください。</p><button class="secondary" data-action="adminSetup">管理者として初期設定</button></details><p class="notice">共通パスワードを忘れると復号できません。パスワードは端末間で共通です。</p></div>`;return}if(page==='home'){app.innerHTML=`<p class="muted">端末内保存・オフライン閲覧対応。最新版の取得には通信が必要です</p><input id="search" placeholder="タイトル・本文を検索" value="${esc(query)}"><div class="toolbar">${button('＋ カテゴリー追加','addCategory')}${button('公開用データを書き出す','export','secondary')}${button('最新版に更新','sync','secondary')}${button('暗号化ファイルを読み込む','import','secondary')}${button('ロック','lock','secondary')}</div><div id="results"></div><p class="notice">この試作品にはログイン・編集権限制限はありません。患者情報や機密情報を入力しないでください。「最新版に更新」は端末の全データを置き換えます。更新前に必ずバックアップを保存してください。GitHub上の暗号化ファイルは公開されますが、本文はパスワードで暗号化されます。端末内も暗号化保存します。</p>`;document.getElementById('search').addEventListener('input',e=>{query=e.target.value;results()});results();return}if(page==='category'){const c=db.categories.find(x=>x.id===selected);if(!c)return nav('home');app.innerHTML=`${button('← 戻る','parentCategory','secondary')}<h2>📁 ${esc(c.name)}</h2><p class="muted">${esc(breadcrumb(c.id))}</p><div class="toolbar">${button('＋ サブカテゴリー作成','addSubcategory')}${button('＋ マニュアル作成','newManual')}${button('カテゴリー名変更','renameCategory','secondary')}${button('カテゴリー移動','moveCategory','secondary')}${button('カテゴリー削除','deleteCategory','secondary')}</div><h2>サブカテゴリー</h2>${categoryCards(selected)||'<p class="muted">サブカテゴリーはありません。</p>'}<h2>マニュアル</h2>${db.manuals.filter(x=>x.categoryId===selected).map(x=>`<button class="item" data-open="${esc(x.id)}"><strong>📄 ${esc(x.title)}</strong><div class="muted">更新：${esc(x.updatedAt||'—')}</div></button>`).join('')||'<p class="muted">まだマニュアルがありません。</p>'}`;return}if(page==='detail'){const m=db.manuals.find(x=>x.id===selected);if(!m)return nav('home');app.innerHTML=`${button('← 戻る','backCategory','secondary')}<h2>${esc(m.title)}</h2><p class="muted">更新：${esc(m.updatedAt||'—')}</p><div class="card"><div class="bodytext">${esc(m.body)}</div>${(m.images||[]).map(src=>`<img alt="マニュアル画像" src="${src}">`).join('')}</div><div class="toolbar">${button('編集','editManual')}${button('削除','deleteManual','secondary')}</div>`;return}if(page==='edit'){const m=editing||{title:'',body:'',images:[]};app.innerHTML=`${button('← キャンセル','cancelEdit','secondary')}<h2>${editing?'マニュアル編集':'新規マニュアル'}</h2><label>タイトル</label><input id="title" maxlength="150" value="${esc(m.title)}"><label>本文</label><textarea id="body" placeholder="検査手順や注意事項を入力">${esc(m.body)}</textarea><div id="preview">${(m.images||[]).map((src,i)=>`<div class="card"><img alt="添付画像" src="${src}"><button class="secondary" data-remove-image="${i}">画像を削除</button></div>`).join('')}</div><div class="toolbar">${button('＋ 写真を追加','addImage','secondary')}${button('保存','saveManual')}</div><p class="muted">画像は端末内に保存されます。大量・高画質の画像は保存容量を圧迫します。</p>`;return}}function results(){const target=document.getElementById('results');if(!target)return;const q=query.trim().toLocaleLowerCase();if(q){const list=db.manuals.filter(m=>(m.title+' '+m.body).toLocaleLowerCase().includes(q));target.innerHTML=`<h2>検索結果（${list.length}件）</h2>${list.map(m=>`<button class="item" data-open="${esc(m.id)}">${esc(m.title)}<div class="muted">${esc(breadcrumb(m.categoryId))}</div></button>`).join('')}`;}else target.innerHTML=`<h2>カテゴリー</h2>${categoryCards(null)}`}
async function download(){try{
 const encrypted=await seal({...db,exportedAt:new Date().toISOString()},secret);
 const blob=new Blob([JSON.stringify(encrypted,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='latest.enc.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }catch(e){alert('書き出しに失敗しました：'+e.message)}}
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{
 if(f.size>20*1024*1024)throw Error('20MBを超えています');
 const encrypted=JSON.parse(await f.text());const data=await unseal(encrypted,secret);
 if(!confirm('現在のマニュアルをすべて置き換えます。バックアップ済みですか？'))return;
 const old=db;db=data;if(!await save()){db=old;return}nav('home');alert('読み込み完了');
 }catch(err){alert('読み込み失敗：'+err.message)}});
async function syncLatest(){
 const b=app.querySelector('[data-action="sync"]');if(b){b.disabled=true;b.textContent='確認中…'}
 try{
 const response=await fetch(REMOTE_FILE+'?t='+Date.now(),{cache:'no-store'});
 if(!response.ok)throw Error('公開データが見つかりません（HTTP '+response.status+'）');
 const raw=await response.text();if(raw.length>25*1024*1024)throw Error('ファイルが大きすぎます');
 const d=await unseal(JSON.parse(raw),secret);
 if(!confirm('公開データ（'+d.manuals.length+'件）で端末内の全データを置き換えます。バックアップ済みですか？'))return;
 const old=db;db=d;if(!await save()){db=old;return}nav('home');alert('最新版を取得しました');
 }catch(e){alert('更新できませんでした：'+e.message)}
 finally{const b2=app.querySelector('[data-action="sync"]');if(b2){b2.disabled=false;b2.textContent='最新版に更新'}}
}
function validData(d){
 if(!d||d.version!==1||!Array.isArray(d.categories)||!Array.isArray(d.manuals))return false;
 if(!d.categories.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&(!c.parentId||typeof c.parentId==='string')))return false;
 if(!d.manuals.every(m=>typeof m.id==='string'&&typeof m.title==='string'&&typeof m.body==='string'&&typeof m.categoryId==='string'&&(!m.images||Array.isArray(m.images)&&m.images.every(x=>typeof x==='string'&&x.startsWith('data:image/')))))return false;
 if(d.categories.some(c=>c.parentId&&!d.categories.some(p=>p.id===c.parentId)))return false;
 if(d.categories.some(c=>{const seen=new Set([c.id]);let p=c.parentId;while(p){if(seen.has(p))return true;seen.add(p);p=d.categories.find(x=>x.id===p)?.parentId}return false}))return false;
 return d.manuals.every(m=>d.categories.some(c=>c.id===m.categoryId));
}
document.getElementById('imageFile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!f.type.startsWith('image/')||f.size>2*1024*1024){alert('画像は2MB以下にしてください');return}const r=new FileReader();r.onload=()=>{const src=String(r.result);if(!/^data:image\/(png|jpeg|gif|webp);base64,/.test(src)){alert('PNG・JPEG・GIF・WebPのみ対応しています');return}editing.images.push(src);const title=document.getElementById('title').value,body=document.getElementById('body').value;editing.title=title;editing.body=body;render()};r.readAsDataURL(f)});
app.addEventListener('click',async e=>{const rm=e.target.closest('[data-remove-image]');if(rm){editing.title=document.getElementById('title').value;editing.body=document.getElementById('body').value;editing.images.splice(Number(rm.dataset.removeImage),1);render();return}const cat=e.target.closest('[data-cat]');if(cat)return nav('category',cat.dataset.cat);const open=e.target.closest('[data-open]');if(open)return nav('detail',open.dataset.open);const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;switch(a){case'home':nav('home');break;case'backCategory':nav('category',db.manuals.find(x=>x.id===selected)?.categoryId);break;case'addCategory':{const name=prompt('カテゴリー名');if(name?.trim()){db.categories.push({id:id(),name:name.trim(),parentId:null});if(await save())render()}break}case'parentCategory':{const c=db.categories.find(x=>x.id===selected);nav(c?.parentId?'category':'home',c?.parentId||null);break}case'addSubcategory':{const name=prompt('サブカテゴリー名');if(name?.trim()){db.categories.push({id:id(),name:name.trim(),parentId:selected});if(await save())render()}break}case'moveCategory':{const options=db.categories.filter(c=>!descendants(selected).has(c.id));const text=['0: 最上位へ',...options.map((c,i)=>`${i+1}: ${breadcrumb(c.id)}`)].join('\\n');const choice=prompt('移動先の番号を入力してください\\n'+text);if(choice===null)break;const n=Number(choice);if(!Number.isInteger(n)||n<0||n>options.length)return alert('番号が正しくありません');db.categories.find(c=>c.id===selected).parentId=n===0?null:options[n-1].id;if(await save())render();break}case'renameCategory':{const c=db.categories.find(x=>x.id===selected),name=prompt('新しいカテゴリー名',c.name);if(name?.trim()){c.name=name.trim();if(await save())render()}break}case'deleteCategory':{if(db.manuals.some(x=>x.categoryId===selected)||childrenOf(selected).length)return alert('マニュアルやサブカテゴリーが入っているカテゴリーは削除できません');if(confirm('カテゴリーを削除しますか？')){const parent=db.categories.find(x=>x.id===selected)?.parentId||null;db.categories=db.categories.filter(x=>x.id!==selected);if(await save())nav(parent?'category':'home',parent)}break}case'newManual':editing={title:'',body:'',images:[]};page='edit';render();break;case'editManual':editing=structuredClone(db.manuals.find(x=>x.id===selected));page='edit';render();break;case'cancelEdit':editing?.id?nav('detail',editing.id):nav('category',selected);break;case'addImage':editing.title=document.getElementById('title').value;editing.body=document.getElementById('body').value;document.getElementById('imageFile').click();break;case'saveManual':{const title=document.getElementById('title').value.trim(),body=document.getElementById('body').value;if(!title)return alert('タイトルを入力してください');editing.title=title;editing.body=body;editing.updatedAt=new Date().toLocaleString('ja-JP');if(editing.id){const i=db.manuals.findIndex(x=>x.id===editing.id);db.manuals[i]=editing}else{editing.id=id();editing.categoryId=selected;db.manuals.push(editing)}if(await save())nav('detail',editing.id);break}case'deleteManual':if(confirm('このマニュアルを削除しますか？')){const c=db.manuals.find(x=>x.id===selected)?.categoryId;db.manuals=db.manuals.filter(x=>x.id!==selected);if(await save())nav('category',c)}break;case'export':await download();break;case'unlock':await unlock();break;case'adminSetup':await adminSetup();break;case'lock':lock();break;case'sync':syncLatest();break;case'import':document.getElementById('importFile').click();break}});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
